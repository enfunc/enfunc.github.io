    gsap.fromTo(done, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1, ease: 'expo.out', delay: .25 });
  } });
}
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (send.disabled) return;
  send.disabled = true; sendLb.textContent = 'Sending'; msg.textContent = '';
  try {
    const r = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' }, signal: AbortSignal.timeout?.(15000) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.errors?.map(x => x.message).join(' ') || 'Something went wrong. Please try again.'); }
    sent = ct.open ? 2 : 1;
    showDone();
  } catch (err) {
    msg.textContent = /TypeError|TimeoutError|AbortError/.test(err.name) ? 'Network error. Please try again.' : err.message;
  } finally { send.disabled = false; sendLb.textContent = 'Send'; }
});

/* resize — debounced; while a dialog is open, height-only changes (mobile keyboard, URL bar) are deferred */
let rz;
addEventListener('resize', () => {
  if (openD === About) About.fit();
  clearTimeout(rz);
  rz = setTimeout(() => {
    if (openD && Math.max(1, innerWidth) === W) { pendingResize = true; return; }
    resize();
  }, 150);
}, { passive: true });

/* intro */
function start() {
  clearTimeout(window.__enf);
  document.documentElement.classList.remove('nogsap');
  const d = RM ? .4 : 1;
  gsap.set('.l', { yPercent: RM ? 0 : 38, filter: RM ? 'none' : 'blur(16px)' });
  gsap.timeline()
    .to(intro, { v: 1, duration: 2.6 * d, ease: 'power2.inOut' }, 0)
    .fromTo(mark, { letterSpacing: RM ? '-.01em' : '.28em' }, { letterSpacing: '-.01em', duration: 2.4 * d, ease: 'expo.out' }, .15)
    .to('.l', { opacity: 1, yPercent: 0, filter: 'blur(0px)', duration: 1.9 * d, ease: 'expo.out', stagger: .075 * d }, .15)
    .call(() => { gsap.set('.l', { clearProps: 'filter,transform' }); ready = true; }, null, (.15 + 1.9 + .075 * 5) * d)
    .to('.tag .w', { opacity: 1, y: 0, duration: 1.3 * d, ease: 'expo.out', stagger: .07 * d, clearProps: 'transform' }, 1.05 * d)
    .to(tc, { opacity: .17, duration: 3 * d, ease: 'power1.inOut' }, .8 * d)
    .to(foot, { opacity: 1, duration: 1.4 * d, onStart: () => { foot.inert = false; } }, 1.7 * d);
}
Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1800))]).then(() => requestAnimationFrame(start));
})();
</script>
